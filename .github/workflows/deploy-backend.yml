name: Deploy Backend → Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # --- 1. DESPLIEGUE DE LA API WEB ---
      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: cfdi-suite-api
          region: us-central1
          source: ./backend
          # overwrite (no merge, el default): env_vars de aquí abajo es la ÚNICA
          # fuente de verdad de las variables del servicio -- cualquier variable
          # puesta a mano con `gcloud` que no esté listada aquí se BORRA en el
          # siguiente deploy. A propósito: "merge" fue la causa real de que
          # REMOTE_ZIP_SHARD_READ y BATCH_JOB_NAME quedaran pegados en producción
          # 8+ días sin que nadie lo notara (ver PROJECT_STATE.md, 2026-07-22) --
          # con "overwrite", ese tipo de fuga ya no puede pasar en silencio: o la
          # variable está aquí, versionada, o no existe en el servicio.
          # Antes de activar esto se comparó la lista completa contra las
          # variables realmente vivas en producción (`gcloud run services
          # describe ... spec.template.spec.containers[0].env`) para no borrar
          # nada por accidente en el primer deploy con este modo -- GCS_BUCKET_NAME
          # faltaba aquí y sí estaba vivo, se agregó abajo.
          env_vars_update_strategy: overwrite
          env_vars: |
            ALLOWED_ORIGINS=${{ vars.VERCEL_URL }}
            REDIS_HOST=${{ vars.REDIS_HOST }}
            REDIS_PORT=6379
            MODE=api
            REQUIRE_API_AUTH=true
            API_URL=https://cfdi-suite-api-hfg67q6kbq-uc.a.run.app
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}
            PUSHER_KEY=${{ vars.PUSHER_KEY }}
            PUSHER_CLUSTER=${{ vars.PUSHER_CLUSTER }}
            GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}
            REMOTE_ZIP_SHARD_READ=true
            BATCH_JOB_ENABLED=true
            BATCH_JOB_THRESHOLD=500
            BATCH_JOB_SHARD_SIZE=20
            BATCH_JOB_NAME=cfdi-batch-shard
          # Secretos que Cloud Run inyecta desde Secret Manager (no visibles en
          # consola ni en --set-env-vars). Requiere crear cada secreto en GCP
          # Secret Manager antes del despliegue:
          #   gcloud secrets create redis-password --replication-policy=automatic
          #   echo -n "..." | gcloud secrets versions add redis-password --data-file=-
          #   gcloud secrets create pusher-secret --replication-policy=automatic
          #   echo -n "..." | gcloud secrets versions add pusher-secret --data-file=-
          #   gcloud secrets create api-bearer-token --replication-policy=automatic
          #   echo -n "..." | gcloud secrets versions add api-bearer-token --data-file=-
          # La SA cfdi-suite-api-sa necesita secretmanager.versions.access sobre
          # estos secretos (ya otorgado en fix #26).
          secrets: |
            REDIS_PASSWORD=redis-password:latest
            PUSHER_SECRET=pusher-secret:latest
            API_BEARER_TOKEN=api-bearer-token:latest
          # OJO: `flags` es un bloque literal (|), no una lista YAML. Todo lo
          # que se escriba adentro se le pasa tal cual a gcloud como bandera --
          # un comentario `#` aquí dentro rompe el deploy. Los comentarios van
          # aquí arriba.
          #
          # --service-account: sin esta bandera Cloud Run corre con la default
          # compute SA (706861124428-compute@developer.gserviceaccount.com),
          # que tiene rol Editor sobre todo el proyecto -- cualquier RCE o SSRF
          # en el servicio se vuelve control de escritura de todo el GCP. La SA
          # dedicada sólo trae objectAdmin sobre el bucket, cloudtasks.enqueuer,
          # run.invoker, cloudtrace.agent y serviceAccountTokenCreator (para las
          # signed URLs).
          flags: |
            --allow-unauthenticated
            --cpu=2
            --memory=2Gi
            --max-instances=10
            --timeout=1800
            --concurrency=5
            --service-account=cfdi-suite-api-sa@ultra-acre-431617-p0.iam.gserviceaccount.com

      - name: Route traffic to latest ready revision
        run: gcloud run services update-traffic cfdi-suite-api --to-latest --region us-central1
